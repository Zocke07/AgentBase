# The toolchain both CI jobs need, in one place: GitHub Actions has no YAML
# anchors, and two copies of six steps drift. Every action ref below was
# confirmed to exist through GitHub's `git/ref` API on 2026-09-11; `setup-uv`
# is an exact version because astral-sh publishes no bare `v10` tag.
name: Toolchain
description: Install just, uv and Node, and restore this repository's redirected package caches.

runs:
  using: composite
  steps:
    # CI runs the same `just` recipes a developer does.
    - name: Install just
      uses: extractions/setup-just@v4

    # No `actions/setup-python`: uv fetches the pinned interpreter itself.
    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        # The justfile redirects UV_CACHE_DIR; `actions/cache` below covers it.
        enable-cache: false

    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    # The justfile redirects every package cache into `.dev/cache`, so that is
    # the directory worth caching. `src-tauri/target` is deliberately not:
    # restoring it across runs is how a stale `externalBin` gets bundled.
    - name: Restore the redirected package caches
      uses: actions/cache@v6
      with:
        path: .dev/cache
        key: dev-cache-${{ runner.os }}-${{ hashFiles('apps/backend/uv.lock', 'apps/desktop/package-lock.json', 'apps/desktop/src-tauri/Cargo.lock') }}
        restore-keys: |
          dev-cache-${{ runner.os }}-
