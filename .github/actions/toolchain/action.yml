# Share the CI toolchain because Actions lacks YAML anchors. Action refs were
# verified with GitHub's `git/ref` API on 2026-09-11; Astral publishes no bare
# `setup-uv` `v10` tag, so its version is exact.
name: Toolchain
description: Install just, uv and Node, and restore this repository's redirected package caches.

runs:
  using: composite
  steps:
    # CI uses the same `just` recipes as developers.
    - name: Install just
      uses: extractions/setup-just@v4

    # uv fetches the pinned interpreter; omit `actions/setup-python`.
    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        # The justfile redirects UV_CACHE_DIR; cache it below.
        enable-cache: false

    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    # The justfile redirects package caches to `.dev/cache`. Do not restore
    # `src-tauri/target`: it can bundle a stale `externalBin`.
    - name: Restore the redirected package caches
      uses: actions/cache@v6
      with:
        path: .dev/cache
        key: dev-cache-${{ runner.os }}-${{ hashFiles('apps/backend/uv.lock', 'apps/desktop/package-lock.json', 'apps/desktop/src-tauri/Cargo.lock') }}
        restore-keys: |
          dev-cache-${{ runner.os }}-
