# BUILD_SPEC §5 Phase 9: CI and release. `build` declares `needs: test`, so
# nothing is bundled until every leg of the test matrix is green. Both jobs
# run on windows-latest and macos-latest. The repository is public on purpose:
# private-repo minutes bill at 2x on Windows and 10x on macOS.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run's answer irrelevant. Tags
# are exempt: a release build must not be cancelled by whatever lands next.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default. The one job that needs to write asks for it itself.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # When one platform breaks, the other's result is the useful thing on the page.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      # `just ci` is `check` + `test`. The two build-dependent guards skip
      # here, since nothing is built yet; the build job runs them afterwards.
      - name: Lint, typecheck and test
        run: just ci

  build:
    name: build (${{ matrix.os }})
    # The gate. Every leg of `test` must be green before anything is bundled.
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # PyInstaller does not cross-compile, hence a matrix job.
      - name: Build the sidecar and the bundle
        run: just build-installer

      # Preserve the app's executable modes and bundle root across artifact upload.
      - name: Archive the macOS app
        if: runner.os == 'macOS'
        run: just package-macos

      # The guards that skipped in the test job, after the build so they have
      # something to inspect, with `--require-build-checks` so a missing
      # artefact fails instead of skipping.
      - name: Verify the built artefacts
        run: just verify-build

      # After the build, which looks backwards for a lint and is pinned by a
      # test: `tauri-build` validates `externalBin` on every cargo invocation,
      # clippy included, so it needs the frozen sidecar to exist.
      - name: Lint the Rust shell
        run: just check-tauri

      # `if-no-files-found: error` so a bundle that silently failed to appear
      # fails the job rather than uploading nothing under a green tick.
      - name: Upload the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: AgentSpace-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload the macOS app archive
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: AgentSpace-macos-app
          path: apps/desktop/src-tauri/target/release/bundle/macos/*.app.zip
          if-no-files-found: error

  smoke:
    name: install and run with no Python on the path
    # §5 Phase 9's "second Windows machine with no Python installed", as near
    # as CI can state it: a fresh runner, the artefact the build job uploaded,
    # and the installed sidecar launched with Python scrubbed from PATH. The
    # scrub is asserted before anything launches.
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      - name: Download the installer the build job produced
        uses: actions/download-artifact@v8
        with:
          name: AgentSpace-windows-installer
          path: dist

      - name: Install it, and run the installed sidecar with no Python
        env:
          AGENTSPACE_INSTALLER_DIR: ${{ github.workspace }}/dist
        run: just verify-installed

  release:
    name: publish the Windows installer and macOS app
    # Only for a version tag; every green run still leaves the installer as a
    # workflow artefact. Needs `smoke` too: an installer that did not run on a
    # clean machine must not become a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download the installer built by the Windows job
        uses: actions/download-artifact@v8
        with:
          name: AgentSpace-windows-installer
          path: dist

      - name: Download the app archive built by the macOS job
        uses: actions/download-artifact@v8
        with:
          name: AgentSpace-macos-app
          path: dist

      # Shipped unsigned; the release notes say so.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*-setup.exe dist/*.app.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "AgentSpace $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"
