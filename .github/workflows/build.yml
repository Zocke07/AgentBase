# BUILD_SPEC §5 Phase 9: `build` needs every Windows and macOS test leg. The
# public repository avoids private-minute multipliers (2x Windows, 10x macOS).

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel stale branch runs, but never release-tag builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Default to read-only; the release job requests writes.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms when one fails.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      # `just ci` runs `check` and `test`; build-dependent guards run after build.
      - name: Lint, typecheck and test
        run: just ci

  build:
    name: build (${{ matrix.os }})
    # Bundle only after every test leg passes.
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # PyInstaller requires a per-platform build. macOS produces a DMG, which
      # preserves executable modes through artifact upload unlike a raw .app.
      - name: Build the sidecar and the bundle
        run: just build-installer

      # Run skipped build guards after output exists; missing artifacts fail.
      - name: Verify the built artefacts
        run: just verify-build

      # `tauri-build` validates `externalBin` on every Cargo invocation,
      # including Clippy, so lint after freezing the sidecar.
      - name: Lint the Rust shell
        run: just check-tauri

      # Fail rather than upload an empty successful artifact.
      - name: Upload the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: AgentBase-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload the macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: AgentBase-macos-app
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  smoke:
    name: install and run with no Python on the path
    # §5 Phase 9's clean Windows machine: fresh runner, built artifact, and
    # installed sidecar with Python removed from PATH (asserted before launch).
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      - name: Download the installer the build job produced
        uses: actions/download-artifact@v8
        with:
          name: AgentBase-windows-installer
          path: dist

      - name: Install it, and run the installed sidecar with no Python
        env:
          AGENTBASE_INSTALLER_DIR: ${{ github.workspace }}/dist
        run: just verify-installed

  release:
    name: publish the Windows installer and macOS app
    # Publish version tags only after smoke; other green runs retain artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download the installer built by the Windows job
        uses: actions/download-artifact@v8
        with:
          name: AgentBase-windows-installer
          path: dist

      - name: Download the disk image built by the macOS job
        uses: actions/download-artifact@v8
        with:
          name: AgentBase-macos-app
          path: dist

      # Corrected tags replace notes and assets. The macOS app is ad-hoc signed,
      # not notarized.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentBase $GITHUB_REF_NAME" \
              --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"
            gh release upload "$GITHUB_REF_NAME" dist/*-setup.exe dist/*.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*-setup.exe dist/*.dmg \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentBase $GITHUB_REF_NAME" \
              --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"
          fi
