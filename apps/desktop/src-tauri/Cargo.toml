[package]
name = "agentbase-desktop"
version = "0.4.8"
description = "AgentBase desktop shell"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "agentbase_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# BUILD_SPEC §5 Phase 3: JS uses this plugin to write and clear OS-keychain
# keys; spawn-time reads use `keyring` below. The plugin's `get_password().ok()`
# masks locked-keychain and macOS-Deny failures as missing keys (observed as
# `sending 0 key(s)`). Matching crate and features lets Cargo resolve one copy.
tauri-plugin-keyring = "0.1"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
# BUILD_SPEC §5 Phase 11: Rust-only `reveal_folder` checks paths remain in the
# data directory before calling this plugin; the webview gets no JS command.
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
