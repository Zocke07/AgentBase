[project]
name = "agentbase"
version = "0.4.6"
description = "Local-first autonomous agent co-working space: FastAPI sidecar."
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115.0",
    # The HTTP client the providers call model APIs with. A runtime dependency
    # from Phase 3 on: it was previously dev-only, arriving under Starlette's
    # TestClient. The distribution is `httpx2` and the module it provides is
    # `httpx2`, not `httpx`, which is the httpx 2.x line.
    "httpx2>=2.12.0",
    # RSS and Atom are untrusted network input. The feed reader uses the
    # hardened ElementTree wrapper so entity expansion and external entities
    # are refused before any entry reaches a model.
    "defusedxml>=0.7.1",
    "uvicorn>=0.32.0",
    # BUILD_SPEC §5 Phase 8 names both libraries. Unlike the provider SDKs
    # (which §5 Phase 3 left open, and which this project deliberately declined
    # in favour of raw HTTP), a chat gateway is not a JSON-over-HTTP endpoint:
    # Discord is a stateful websocket with a heartbeat and a resume protocol,
    # and reimplementing that is a project, not an adapter.
    "discord-py>=2.4.0",
    "openai-codex>=0.154.0",
]

[dependency-groups]
dev = [
    "anyio>=4.0.0",
    "mypy>=1.18.2",
    "pyinstaller>=6.11.0",
    "pytest>=8.4.2",
    # `just test-backend-cov` names `--cov`, so the command must declare the
    # plugin that implements that option instead of depending on a warm machine.
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.14.0",
    "types-defusedxml>=0.7.0.20250822",
    # Read by `test_ci_workflow.py` only. The CI workflow is the one file that
    # encodes Phase 9's acceptance criterion (the test job gating the build job)
    # and a silently deleted `needs:` would leave a release built on untested
    # code with nothing to notice. Dev-only, so it never reaches the frozen
    # sidecar.
    "pyyaml>=6.0.2",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbase"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "DTZ",       # flake8-datetimez: no naive datetimes in an event log
    "PTH",       # flake8-use-pathlib (BUILD_SPEC §5 Phase 0: zero string path concat)
    "SIM",       # flake8-simplify
    "RUF",       # ruff-specific
    "S",         # flake8-bandit
    "ASYNC",     # flake8-async
    "T20",       # flake8-print: the event log is the output channel, not stdout
    "TID",       # flake8-tidy-imports
    "ARG",       # unused arguments
    "RET",       # flake8-return
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
# The built-in tools implement the `Tool` protocol, whose `execute` takes the
# sandbox because `run_shell` needs it as a working directory. The filesystem
# and network tools resolved everything they need in `prepare`, so they hold a
# parameter they do not read, and renaming it to `_sandbox` would stop them
# conforming to the protocol. Same exemption, same scope and same reasoning as
# the test doubles below: ARG002 only, so ARG001 keeps its signal.
"src/agentbase/tools/builtin/**" = ["ARG002"]
# `discord.py` passes the Button object to its own decorator's callback. It is
# not read here, and renaming it to `_x` would stop the library recognising the
# signature. Same exemption, same scope and same reasoning as the two below:
# ARG002 only, so ARG001 keeps the signal that caught a real unused parameter
# in Phase 3.
"src/agentbase/channels/*_adapter.py" = ["ARG002"]
"tests/**" = [
    "S101",  # assert is the point of a test
    # Test doubles implement a Protocol, so they must keep the parameter names
    # they do not use, renaming them to `_x` would stop them conforming. This
    # is scoped to ARG002 (method arguments) on purpose: ARG001 stays on, and
    # promptly caught a genuinely unused parameter in `test_providers.py`.
    "ARG002",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["agentbase"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy: strict, no escape hatches
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
disallow_any_explicit = false
no_implicit_reexport = true
show_error_codes = true
pretty = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
# No single test should take this long. Without a cap, an SSE stream that
# fails to terminate hangs the suite (and in Phase 9, the CI job) instead
# of failing. anyio is declared explicitly because the async tests run on
# its pytest plugin; it arrives under Starlette either way, but depending on
# a transitive dependency for the test harness is how a suite breaks on an
# unrelated upgrade.
timeout = 60
