[project]
name = "agentbase"
version = "0.4.8"
description = "Local-first autonomous agent co-working space: FastAPI sidecar."
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115.0",
    # Provider HTTP client; runtime since Phase 3. The `httpx2` distribution
    # provides `httpx2`, not the separate `httpx` 2.x module.
    "httpx2>=2.12.0",
    # Reject entity expansion and external entities in untrusted RSS/Atom before
    # entries reach a model.
    "defusedxml>=0.7.1",
    "uvicorn>=0.32.0",
    # BUILD_SPEC §5 Phase 8 requires Discord. Its stateful WebSocket, heartbeat,
    # and resume protocol need a gateway library, unlike raw provider HTTP.
    "discord-py>=2.4.0",
    "openai-codex>=0.154.0",
    # `zoneinfo` reads the OS time-zone database, which Windows lacks; without
    # this, `ZoneInfo("America/New_York")` fails at import and the sidecar
    # cannot start. PyInstaller's `zoneinfo` hook freezes it into the binary.
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "anyio>=4.0.0",
    "mypy>=1.18.2",
    "pyinstaller>=6.11.0",
    "pytest>=8.4.2",
    # `just test-backend-cov` requires the plugin that implements `--cov`.
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.14.0",
    "types-defusedxml>=0.7.0.20250822",
    # Used only by `test_ci_workflow.py` to verify Phase 9's test-before-build
    # gate; dev-only, so it never reaches the frozen sidecar.
    "pyyaml>=6.0.2",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbase"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "DTZ",       # flake8-datetimez: no naive datetimes in an event log
    "PTH",       # flake8-use-pathlib (BUILD_SPEC §5 Phase 0: zero string path concat)
    "SIM",       # flake8-simplify
    "RUF",       # ruff-specific
    "S",         # flake8-bandit
    "ASYNC",     # flake8-async
    "T20",       # flake8-print: the event log is the output channel, not stdout
    "TID",       # flake8-tidy-imports
    "ARG",       # unused arguments
    "RET",       # flake8-return
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
# `Tool.execute` requires `sandbox` for `run_shell`; filesystem and network
# tools resolve it in `prepare`. Keep their protocol signature and exempt only
# ARG002, preserving ARG001 diagnostics.
"src/agentbase/tools/builtin/**" = ["ARG002"]
# `discord.py` requires the unused Button callback parameter. Exempt only
# ARG002, preserving ARG001 diagnostics.
"src/agentbase/channels/*_adapter.py" = ["ARG002"]
"tests/**" = [
    "S101",  # assert is the point of a test
    # Test doubles must keep Protocol parameter names. Exempt only method-arg
    # ARG002; ARG001 still catches genuinely unused parameters.
    "ARG002",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["agentbase"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy: strict, no escape hatches
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
disallow_any_explicit = false
no_implicit_reexport = true
show_error_codes = true
pretty = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
# Cap tests so a non-terminating SSE stream fails instead of hanging local or
# Phase 9 CI. Declare anyio explicitly for its pytest plugin, not transitively.
timeout = 60
