[project]
name = "agentspace"
version = "0.1.0"
description = "Local-first autonomous agent co-working space — FastAPI sidecar."
requires-python = "==3.12.*"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentspace"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C4",        # flake8-comprehensions
    "DTZ",       # flake8-datetimez  — no naive datetimes in an event log
    "PTH",       # flake8-use-pathlib — BUILD_SPEC §5 Phase 0: zero string path concat
    "SIM",       # flake8-simplify
    "RUF",       # ruff-specific
    "S",         # flake8-bandit
    "ASYNC",     # flake8-async
    "T20",       # flake8-print — the event log is the output channel, not stdout
    "TID",       # flake8-tidy-imports
    "ARG",       # unused arguments
    "RET",       # flake8-return
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is the point of a test
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["agentspace"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy — strict, no escape hatches
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
disallow_any_explicit = false
no_implicit_reexport = true
show_error_codes = true
pretty = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
